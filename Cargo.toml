[workspace]
resolver = "3"
members = ["crates/private-data-vault-core", "crates/private-data-vault-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mAIvn-developer/maivn-private-data-vault"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
